# EXEMPLO de tabela de preços. Os valores abaixo são FICTÍCIOS (marcadores de posição).
# Copie para config/prices.toml (ou aponte VERION_PRICES para outro arquivo) e preencha cada
# preço com o valor da página oficial do provedor, registrando a fonte e a data em `source`.
# Regras (verion.config.load_prices):
#   - métodos grátis (ken-burns, parallax-2.5d): price_per_unit = 0 e unit_kind = "none";
#   - métodos pagos: price_per_unit > 0 e unit_kind diferente de "none";
#   - currency = "USD" é convertida por fx_usd_brl; "BRL" é usada como está.

