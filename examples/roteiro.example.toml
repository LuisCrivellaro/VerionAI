# Roteiro de EXEMPLO da Fase 0 (12 cenas). As fotos em examples/fotos/ são imagens sintéticas
# (gradiente + moldura), geradas só para testes: não representam nenhum imóvel.
#
# Regras (verion.script.load_script):
#   - property_id: id neutro, ^[a-z0-9-]{1,32}$ (nunca endereço, nome ou telefone);
#   - exatamente 12 [[scenes]], index 1..12 sem repetição;
#   - photo: caminho relativo a ESTA pasta (ou absoluto); o arquivo precisa existir;
#   - camera: push-in | pull-out | pan-left | pan-right | static;
#   - duration_s: duração alvo, de 3.0 a 10.0 s;
#   - prompt: descreve SÓ o movimento de câmera. Nunca cite objeto, pessoa ou detalhe que não esteja
#     na foto (regra de fidelidade visual do VÉRION).
# Fotos reais de imóveis ficam em data/ (fora do git), com autorização escrita do proprietário.

property_id = "exemplo-sintetico"

[[scenes]]
index = 1
photo = "fotos/01-sala.jpg"
room = "sala"
camera = "push-in"
duration_s = 6.0
prompt = "Push-in lento e contínuo em direção ao centro do ambiente. Não adicionar objetos, pessoas ou mudanças de luz."
negative_prompt = "pessoas, animais, objetos novos, móveis novos"

[[scenes]]
index = 2
photo = "fotos/02-cozinha.jpg"
room = "cozinha"
camera = "pan-right"
