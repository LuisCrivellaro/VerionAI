[project]
name = "verion"
version = "0.1.0"
description = "VÉRION: harness da Fase 0 (comparação de métodos de geração de vídeo com controle de custo)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Hipótese da spec (FASE0_HARNESS.md, correção E): versão e capacidades do SDK a confirmar na T9.
gemini = ["google-genai>=2.19.0"]

[project.scripts]
verion = "verion.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verion"]

[tool.ruff]
# Scripts de terceiros vendorizados nas skills (ex.: gemini-omni-flash-api, Apache-2.0): não são código do projeto.
extend-exclude = [".claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"
